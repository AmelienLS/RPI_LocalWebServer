<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gérer les utilisateurs</title>
    <link rel="stylesheet" href="/Styles/common.css">
    <link rel="stylesheet" href="/Styles/gererU.css">
    <link rel="icon" href="/Images/Logo.png" type="image/png">
</head>
<body>
    <a href="{{ url_for('index') }}" class="admin-link">Retour au menu</a>

    <div class="container">
        <h1>Gérer les utilisateurs</h1>
        <a href="{{ url_for('ajouterU') }}" class="ajouter-link">Ajouter un utilisateur</a>

        <table>
            <thead>
                <tr>
                    <th>Prénom</th>
                    <th>Nom</th>
                    <th>Identifiant</th>
                    <th>Admin</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user['prenom'] }}</td>
                    <td>{{ user['nom'] }}</td>
                    <td>{{ user['identifiant'] }}</td>
                    <td>{{ 'Oui' if user['admin'] == 1 else 'Non' }}</td>
                    <td class="actions-cell">
                        <form method="GET" action="{{ url_for('modifierU') }}">
                            <input type="hidden" name="id" value="{{ user['id'] }}">
                            <button type="submit" class="modifier-btn">Modifier</button>
                        </form>
                        <form method="POST" action="{{ url_for('supprimerU') }}" onsubmit="return confirm('Supprimer {{ user.prenom | e }} {{ user.nom | e }} ?');">
                            <input type="hidden" name="id" value="{{ user['id'] }}">
                            <button type="submit" class="button supprimer-btn">Supprimer</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="5">Aucun utilisateur en base.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script src="/Functions/rotation.js"></script>
</body>
</html>
