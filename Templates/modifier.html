<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un écran</title>
    <link rel="stylesheet" href="/Styles/common.css">
    <link rel="stylesheet" href="/Styles/modifier.css">
    <link rel="stylesheet" href="/Styles/vkeyboard.css">
    <link rel="icon" href="/Images/Logo.png" type="image/png">
</head>
<body>
    <!--Page de modification d'un écran avec recherche préalable par référence -->
    <div class="form-container">
        <h1>Modifier un écran</h1>

        <!-- Formulaire de modification -->
        <form action="/modifier" method="post">
            {% if not ref_ecran %}
            <!-- Saisie de la référence écran pour rechercher -->
            <label for="ref_ecran">Référence Écran :</label>
            <input type="text" id="ref_ecran" name="ref_ecran" required>
            <button type="submit">Chercher</button>
            {% else %}
            <!-- Modification de l'écran -->
            <input type="hidden" name="old_ref_ecran" value="{{ ref_ecran }}">
            
            <label for="new_ref_ecran">Nouvelle Référence Écran :</label>
            <input type="text" id="new_ref_ecran" name="new_ref_ecran" value="{{ ref_ecran }}" required maxlength="9" minlength="9">

            <label for="libelle">Libellé :</label>
            <input type="text" id="libelle" name="libelle" value="{{ libelle or '' }}" required>

            <label for="pcb">PCB :</label>
            <input type="text" id="pcb" name="pcb" value="{{ pcb or '' }}" maxlength="9" minlength="9">

            <label for="fab">Fabriquant :</label>
            <input type="text" id="fab" name="fab" value="{{ fab or '' }}" required maxlength="2" minlength="2">

            <label for="n_fab">Numéro de Fabrication :</label>
            <input type="text" id="n_fab" name="n_fab" value="{{ n_fab or '' }}" maxlength="7" minlength="7">

            <label for="type">Type :</label>
            <input type="text" id="type" name="type" value="{{ type_ or '' }}" required>

            <label for="n">N° :</label>
            <input type="text" id="n" name="n" value="{{ n or '' }}" required maxlength="3" minlength="3">

            <label for="sorti">Sortie :</label>
            <select id="sorti" name="sorti">
                <option value="0" {% if sorti == '0' %} selected {% endif %}>Non</option>
                <option value="1" {% if sorti == '1' %} selected {% endif %}>Oui</option>
            </select>

            <label for="lave">Lavé :</label>
            <select id="lave" name="lave">
                <option value="0" {% if lave == '0' %} selected {% endif %}>Non</option>
                <option value="1" {% if lave == '1' %} selected {% endif %}>Oui</option>
            </select>

            <button type="submit">Mettre à jour</button>
            {% endif %}
        </form>

        <!-- Affichage du message de réussite -->
        {% if message %}
            <div class="success">
                <p>{{ message }}</p>
            </div>
        {% endif %}

        <!-- Affichage d'un message d'erreur si l'écran n'existe pas -->
        {% if error %}
            <div class="error">
                <p>Écran non trouvé. Veuillez vérifier la référence et réessayer.</p>
                <a href="/modifier" style="color: white; text-decoration: underline;">Réessayer</a>
            </div>
        {% endif %}

        <!-- Bouton de retour -->
        <a href="/index" class="admin-link">Retour au menu</a>
    </div>
    <script src="/Functions/vkeyboard.js"></script>
    <script src="/Functions/rotation.js"></script>
</body>
</html>
