<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Styles/common.css">
    <link rel="stylesheet" href="/Styles/ajouter.css">
    <link rel="stylesheet" href="/Styles/vkeyboard.css">
    <link rel="icon" href="/Images/Logo.png" type="image/png">
    <title>Ajouter écran</title>
</head>
<body>
    <!--Page pour ajouter une nouvelle écran dans la base de données -->
    <a href="/close_db" class="retour">Fermer connexion DB et retour au menu</a>
    <div class="ie-bar">
        <a href="/export_serigraphie" class="ie-btn">Exporter</a>
        <button type="button" class="ie-btn" onclick="document.getElementById('import-input').click()">Importer</button>
        <form id="import-form" action="/import_serigraphie" method="POST" enctype="multipart/form-data" style="display:none">
            <input id="import-input" type="file" name="import_file" accept=".csv,.xlsx"
                   onchange="document.getElementById('import-form').submit()">
        </form>
    </div>
    <div class="form-container">
        <h1>Ajouter un écran</h1>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        {% if success %}
        <p class="success">{{ success }}</p>
        {% endif %}
        <form method="POST">
            <label for="ref_ecran">Réf Écran (9 caractères):</label>
            <input type="text" id="ref_ecran" name="ref_ecran" value="{{ ref_ecran or '' }}" required>

            <label for="libelle">Libellé:</label>
            <input type="text" id="libelle" name="libelle" value="{{ libelle or '' }}" required>

            <label for="pcb">PCB (9 caractères):</label>
            <input type="text" id="pcb" name="pcb" value="{{ pcb or '' }}">

            <label for="fab">Fabricant (2 caractères):</label>
            <input type="text" id="fab" name="fab" value="{{ fab or '' }}" required>

            <label for="n_fab">N° Fab (F + 6 caractères):</label>
            <input type="text" id="n_fab" name="n_fab" value="{{ n_fab or '' }}">

            <label for="type">Type:</label>
            <input type="text" id="type" name="type" value="{{ type or '' }}" required>

            <label for="n">N° (3 caractères):</label>
            <input type="text" id="n" name="n" value="{{ n or '' }}" required>

            <button type="submit">Ajouter</button>
        </form>
    </div>
    <script src="/Functions/vkeyboard.js"></script>
</body>
</html>
