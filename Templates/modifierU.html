<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un utilisateur</title>
    <link rel="stylesheet" href="/Styles/common.css">
    <link rel="stylesheet" href="/Styles/ajouterU.css">
    <link rel="stylesheet" href="/Styles/vkeyboard.css">
    <link rel="icon" href="/Images/Logo.png" type="image/png">
</head>
<body>
<div class="page-screen">

    <div class="topbar">
        <a href="{{ url_for('gerer_utilisateurs') }}" class="topbar-back">← Utilisateurs</a>
        <span class="topbar-title">Modifier un utilisateur</span>
    </div>

    <div class="ajouterU-wrap">
        <div class="card">
            <div class="card-body">
                {% if error %}
                <div class="flash-error">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <input type="hidden" name="id" value="{{ user['id'] }}">

                    <div class="ajouterU-name-grid">
                        <div class="form-group">
                            <label for="prenom">Prénom</label>
                            <input type="text" id="prenom" name="prenom" value="{{ user['prenom'] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" value="{{ user['nom'] }}" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="identifiant">Identifiant</label>
                        <input type="text" id="identifiant" name="identifiant" value="{{ user['identifiant'] }}" required>
                    </div>

                    <div class="divider-label">Rôle</div>
                    <div class="ajouterU-role-btns">
                        <button type="button" id="btn-role-user"
                                class="role-btn {% if user['admin'] != 1 %}role-btn-active-user{% endif %}"
                                onclick="setRole('user')">Utilisateur</button>
                        <button type="button" id="btn-role-admin"
                                class="role-btn {% if user['admin'] == 1 %}role-btn-active-admin{% endif %}"
                                onclick="setRole('admin')">Administrateur</button>
                    </div>
                    <input type="hidden" name="admin" id="admin-hidden" value="{% if user['admin'] == 1 %}on{% endif %}">

                    <button type="submit" style="padding:20px; font-size:17px;">Enregistrer</button>
                </form>
            </div>
        </div>
        <div style="height:20px;"></div>
    </div>
</div>

<script src="/Functions/vkeyboard.js"></script>
<script src="/Functions/rotation.js"></script>
<script>
function setRole(role) {
    var isAdmin = role === 'admin';
    document.getElementById('admin-hidden').value = isAdmin ? 'on' : '';
    document.getElementById('btn-role-user').className  = 'role-btn' + (!isAdmin ? ' role-btn-active-user' : '');
    document.getElementById('btn-role-admin').className = 'role-btn' + (isAdmin  ? ' role-btn-active-admin' : '');
}
</script>
</body>
</html>
