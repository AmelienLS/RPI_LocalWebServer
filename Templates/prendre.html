<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendre écran</title>
    <link rel="stylesheet" href="/Styles/common.css">
    <link rel="stylesheet" href="/Styles/prendre.css">
    <link rel="stylesheet" href="/Styles/vkeyboard.css">
    <link rel="icon" href="/Images/Logo.png" type="image/png">
</head>
<body>
    <!--Page pour prendre un écran -->
    <div class="container">
        <a href="{{ url_for('index') }}" class="admin-link">Retour au menu</a>
        
        <h1>Prendre un écran</h1>

        <form method="POST">
            <div class="form-container">
                <input type="text" name="ref_ecran" placeholder="Ref écran" required>
                <button type="submit">Prendre</button>
            </div>
        </form>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        {% if apercu %}
        <div class="apercu-container">
            <p class="n-value"><strong>Emplacement</strong> {{ apercu['n'] }}</p>
            <p><strong>Réf.</strong> {{ apercu['ref_ecran'] }}</p>
            <p><strong>Libellé</strong> {{ apercu['libelle'] }}</p>
            <p><strong>État</strong> {{ 'Déjà sorti' if apercu['sorti'] == 1 else 'En armoire' }}</p>
        </div>
        {% endif %}
    </div>
    <script src="/Functions/vkeyboard.js"></script>
    <script src="/Functions/rotation.js"></script>
</body>
</html>
